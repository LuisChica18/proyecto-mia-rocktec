name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    name: Compilar scripts (sin errores de sintaxis/import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install pandas==1.5.3 numpy==1.24.3 scikit-learn==1.3.0 scipy==1.11.0 openpyxl==3.1.0

      - name: Compilar todos los scripts de 02_scripts/
        run: python -m py_compile 02_scripts/*.py

  reproducibilidad-holdout:
    name: F1-macro holdout (meta Fase 4 >= 0.75)
    runs-on: ubuntu-latest
    needs: sanity-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install pandas==1.5.3 numpy==1.24.3 scikit-learn==1.3.0 scipy==1.11.0 openpyxl==3.1.0

      - name: Reentrenar TF-IDF+LR y evaluar sobre holdout_test.csv
        run: python 02_scripts/13_evaluacion_holdout.py

      - name: Verificar que F1-macro (TF-IDF+LR) no haya regresado por debajo de 0.75
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path

          reporte = Path("06_resultados/reporte_holdout_final.txt").read_text(encoding="utf-8")
          match = re.search(r"TF-IDF \+ LR.*?F1-macro = ([\d.]+)", reporte)
          if not match:
              print("No se pudo extraer F1-macro del reporte.")
              sys.exit(1)

          f1 = float(match.group(1))
          print(f"F1-macro TF-IDF+LR (holdout): {f1:.4f}")

          if f1 < 0.75:
              print(f"REGRESIÓN: F1-macro {f1:.4f} está por debajo de la meta de Fase 4 (>= 0.75)")
              sys.exit(1)

          print("OK: meta de Fase 4 (F1-macro >= 0.75) se mantiene.")
          EOF

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-holdout
          path: 06_resultados/reporte_holdout_final.txt
